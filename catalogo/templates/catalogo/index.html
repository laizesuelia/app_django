<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo</title>
</head>
<body>
    <h1>Meu catálogo de filmes</h1>

    {% for obra in obras %}
        <h2>{{ obra.titulo }}</h2>
        <p>{{ obra.tipo }}</p>
        <a href="{% url 'catalogo:detalhes' obra.id %}">
            Ver detalhes
        </a>
        <hr>
    {% empty %}
        <p>Erro</p>
    {% endfor %}
</body>
</html>
